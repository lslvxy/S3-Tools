[package]
name = "s3rust"
version = "1.0.1"
description = "A cross-platform S3 GUI client (Rust + Tauri)"
authors = ["lise"]
edition = "2021"

[lib]
name = "s3rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-stream = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
chrono = "0.4"
regex = "1"
md5 = "0.7"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
